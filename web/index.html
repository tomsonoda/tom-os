<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>tom-os</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2f6f5; overflow: hidden; font: 15px/1.5 system-ui, sans-serif; color: #1e2b2e; }
  #screen { display: block; width: 100vw; height: 100dvh; touch-action: none; outline: none; }
  /* receives text from on-screen keyboards and input methods */
  #typing { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
  #gear { position: fixed; top: 34px; right: 10px; width: 36px; height: 36px; border-radius: 18px; border: 1px solid #cfdad8;
          background: #fff; color: #0e9f8e; font-size: 18px; cursor: pointer; }
  dialog { border: 0; border-radius: 16px; padding: 22px; width: min(92vw, 460px); box-shadow: 0 10px 40px #0004; }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog p { margin: 6px 0 12px; color: #5b6b6e; font-size: 13px; }
  label { display: block; margin: 10px 0 3px; font-size: 13px; color: #5b6b6e; }
  select, input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cfdad8; border-radius: 8px; font: inherit; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  button.main { background: #0e9f8e; color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; font: inherit; cursor: pointer; }
  #stopped { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #f2f6f5ee; text-align: center; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<input id="typing" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
<button id="gear" title="Settings" aria-label="Settings">&#9881;</button>

<dialog id="settings">
  <h2>Which model writes the apps?</h2>
  <p>tom-os runs in this page. Requests go straight from your browser to the service you choose;
     a key you enter is kept only in this browser.</p>
  <label for="provider">Model</label>
  <select id="provider">
    <option value="demo">Demo (no key: a few scripted answers)</option>
    <option value="claude">Claude (your Anthropic API key)</option>
    <option value="openai">Another server (OpenAI-compatible URL)</option>
  </select>
  <div id="for-claude">
    <label for="claude-key">Anthropic API key</label>
    <input id="claude-key" type="password" placeholder="sk-ant-...">
    <label for="claude-model">Model</label>
    <input id="claude-model" type="text" value="claude-opus-5-5">
  </div>
  <div id="for-openai">
    <label for="openai-url">Chat completions URL (the server must allow requests from web pages)</label>
    <input id="openai-url" type="text" placeholder="http://localhost:11434/v1/chat/completions">
    <label for="openai-key">API key (if the server needs one)</label>
    <input id="openai-key" type="password">
    <label for="openai-model">Model</label>
    <input id="openai-model" type="text">
  </div>
  <div class="row"><button class="main" id="save">OK</button></div>
</dialog>

<div id="stopped"><div><h2>tom-os has stopped</h2><button class="main" onclick="location.reload()">Start again</button></div></div>
<script type="module" src="tomos.js"></script>
</body>
</html>
