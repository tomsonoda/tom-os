# Publishes the browser version (web/) to GitHub Pages when main changes,
# together with the ARM image for tools/android-termux.sh.
# Needs Pages switched on for the repository, once:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
      - name: Build the browser version
        run: make web
      - name: Add the ARM image and what tools/android-termux.sh downloads
        run: |
          make ARCH=aarch64
          mkdir -p web/downloads
          cp build/aarch64/Image web/downloads/tomos-aarch64-Image
          cp tools/mock_llm.py tools/android-termux.sh web/downloads/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
