name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 qemu-system-arm grub-pc-bin grub-common xorriso mtools binaryen
          pip install anthropic
      - name: Build kernel
        run: make
      - name: Test (direct kernel boot)
        run: make test
      - name: Build ISO
        run: make iso
      - name: Test (boot from ISO)
        run: make test-iso
      - name: Build kernel (ARM)
        run: make ARCH=aarch64
      - name: Test (ARM)
        run: make ARCH=aarch64 test
      - name: Test (ARM, virtio on PCI and virtio-gpu)
        run: make ARCH=aarch64 DEVICES=pci test
      - name: Build the browser version
        run: make web
      - name: Test (browser)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          make test-web
      - uses: actions/upload-artifact@v4
        with:
          name: tomos-iso
          path: |
            build/tomos.iso
            build/aarch64/Image
          if-no-files-found: error
