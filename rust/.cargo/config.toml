# The kernel target: bare-metal x86-64 with SSE2 (for floating point)
# and no red zone. core and alloc are compiled for it from source.
[build]
target = "x86_64-tomos.json"

[unstable]
build-std = ["core", "alloc"]
json-target-spec = true
# memcpy and friends come from compiler_builtins: there is no C library
build-std-features = ["compiler-builtins-mem"]

# The ARM image can be loaded at any address.
[target.aarch64-unknown-none]
rustflags = ["-C", "relocation-model=pie"]

# The browser version: one module that exports its stack pointer (the page
# switches it between threads), with a larger stack for the boot thread.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--export=__stack_pointer", "-C", "link-arg=-zstack-size=2097152"]
