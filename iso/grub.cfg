# GRUB menu for the tom-os ISO. @MODEL@ is filled in by `make iso MODEL=...`.
# The LLM server and model can be changed after boot with the /set command.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set timeout=3
set default=0

menuentry "tom-os - graphical (windows, mouse, graphics apps)" {
    multiboot /boot/tomos.elf llm=10.0.2.2:8080 model=@MODEL@
}

menuentry "tom-os - text mode" {
    multiboot /boot/tomos.elf llm=10.0.2.2:8080 model=@MODEL@ gui=0
}

menuentry "tom-os - graphical, large (2048x1536, everything twice as big)" {
    multiboot /boot/tomos.elf llm=10.0.2.2:8080 model=@MODEL@ res=2048x1536
}

menuentry "tom-os - graphical, wide (1920x1080)" {
    multiboot /boot/tomos.elf llm=10.0.2.2:8080 model=@MODEL@ res=1920x1080
}
