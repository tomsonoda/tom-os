# GRUB menu for the tom-os ISO. @MODEL@ is filled in by `make iso MODEL=...`.
# The LLM server and model can also be changed after boot with the /set command.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set timeout=3
set default=0

menuentry "tom-os - LLM server on the host, port 8080 (Claude gateway, llama-server)" {
    multiboot /boot/tomos.elf llm=10.0.2.2:8080 model=@MODEL@
}

menuentry "tom-os - Ollama on the host, port 11434" {
    multiboot /boot/tomos.elf llm=10.0.2.2:11434 model=@MODEL@
}
